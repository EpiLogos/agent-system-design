name: QL Experiment Native

on:
  push:
    branches:
      - ql/experiment-native
  pull_request:

permissions:
  contents: read

jobs:
  native-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Foundation
        run: npm test
        working-directory: ql-agent-experiments/foundation
      - name: Verify Native baseline
        run: node ql-agent-experiments/experiments/native/run-smoke.mjs
