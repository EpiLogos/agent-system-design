name: QL Runtime Foundation

on:
  push:
    branches:
      - main
    paths:
      - 'ql-agent-experiments/foundation/**'
      - '.github/workflows/ql-runtime-foundation.yml'
  pull_request:
    paths:
      - 'ql-agent-experiments/foundation/**'
      - '.github/workflows/ql-runtime-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ql-agent-experiments/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
