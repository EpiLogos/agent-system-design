name: QL Series 1 DSH

on:
  push:
    branches: [ql/deep-runtime]
    paths:
      - 'ql-agent-experiments/comparison/series1/**'
      - 'ql-agent-experiments/deep-ql/test/series1-dsh.test.js'
      - '.github/workflows/ql-series1-dsh.yml'
  pull_request:
    paths:
      - 'ql-agent-experiments/comparison/series1/**'
      - 'ql-agent-experiments/deep-ql/test/series1-dsh.test.js'
      - '.github/workflows/ql-series1-dsh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Install pinned published DSH composition
        working-directory: ql-agent-experiments/comparison/series1
        run: |
          npm install --no-save --no-package-lock \
            @deepseek-ai/cordis@4.0.1 \
            @deepseek-ai/dsh-llm@0.1.0-rc.5 \
            @deepseek-ai/dsh-llm-deepseek@0.1.0-rc.5 \
            @deepseek-ai/dsh-session@0.1.0-rc.5 \
            @deepseek-ai/dsh-session-persistence@0.1.0-rc.5 \
            @deepseek-ai/dsh-session-persistence-jsonl@0.1.0-rc.5 \
            @deepseek-ai/dsh-agent@0.1.0-rc.5

      - name: Pure DSH Series 1 invariants
        working-directory: ql-agent-experiments/deep-ql
        run: node --test test/series1-dsh.test.js

      - name: Real rc5 Cordis / Session / Agent / persistence composition
        run: node ql-agent-experiments/comparison/series1/dsh-structural.mjs > dsh-structural.json

      - name: Publish structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: ql-series1-dsh-structural-${{ github.run_id }}
          path: dsh-structural.json
          if-no-files-found: error
