name: QL Experiment Pi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pi-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Foundation tests
        working-directory: ql-agent-experiments/foundation
        run: npm test
      - name: Pi matched runtime smoke
        run: node ql-agent-experiments/experiments/pi/run-smoke.mjs
