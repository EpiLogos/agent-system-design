name: QL Series 1 Live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Experiment ref to execute
        required: true
        default: ql/deep-runtime
        type: string
      host:
        description: Host profile to execute
        required: true
        default: all
        type: choice
        options: [all, pi, pydantic-ai, native]
      task:
        description: Series 1 task id
        required: true
        default: S1-CODE-001
        type: string
      repetitions:
        description: Repetitions per Classic/Direct/Deep condition
        required: true
        default: '3'
        type: string
      model:
        description: Candidate model id, identical across all host conditions
        required: true
        type: string
      judge_model:
        description: Independent judge model id; required for S1-CHAT-* tasks
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-series1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QL_SERIES1_PROVIDER: openai
      QL_SERIES1_MODEL: ${{ inputs.model }}
      QL_SERIES1_JUDGE_MODEL: ${{ inputs.judge_model }}
      QL_SERIES1_API_KEY: ${{ secrets.QL_SERIES1_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.QL_SERIES1_API_KEY }}
    steps:
      - name: Checkout experiment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Pi model stack
        working-directory: ql-agent-experiments/comparison/series1
        run: npm install --no-save --no-package-lock @earendil-works/pi-ai@0.84.1

      - name: Checkout pinned Pydantic AI
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-ai
          ref: 00db3a4b391eb9a46f3d6e704070bcf725121f75
          path: .series1/pydantic-ai

      - name: Install pinned Pydantic AI model stack
        run: |
          python -m pip install -e '.series1/pydantic-ai/pydantic_graph'
          python -m pip install -e '.series1/pydantic-ai/pydantic_ai_slim[openai]'

      - name: Preflight and execute requested hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p series1-evidence
          if [[ '${{ inputs.host }}' == 'all' ]]; then
            HOSTS=(pi pydantic-ai native)
          else
            HOSTS=('${{ inputs.host }}')
          fi
          for HOST in "${HOSTS[@]}"; do
            node ql-agent-experiments/comparison/series1/preflight.mjs --live --host "$HOST" --task '${{ inputs.task }}' \
              | tee "series1-evidence/${HOST}-preflight.json"
            node ql-agent-experiments/comparison/series1/run.mjs \
              --host "$HOST" \
              --task '${{ inputs.task }}' \
              --repetitions '${{ inputs.repetitions }}' \
              | tee "series1-evidence/${HOST}-run.json"
          done

      - name: Publish Series 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ql-series1-${{ inputs.task }}-${{ github.run_id }}
          path: series1-evidence/*.json
          if-no-files-found: error
