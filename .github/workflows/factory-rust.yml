name: Factory Rust

on:
  pull_request:
    paths:
      - "factory/**"
      - "contracts/factory/**"
      - ".github/workflows/factory-rust.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "factory/**"
      - "contracts/factory/**"
      - ".github/workflows/factory-rust.yml"

jobs:
  factory-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path factory/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path factory/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path factory/Cargo.toml --all-targets
