name: Agent model roster rustfmt

on:
  push:
    branches:
      - agent/execution-model-roster-interop
    paths:
      - "factory/**"
      - ".github/workflows/agent-model-roster-rustfmt.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-model-roster-interop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Factory crate
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- factory; then
            echo "Factory already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add factory
          git commit -m "style(factory): apply cargo fmt"
          git push origin HEAD:agent/execution-model-roster-interop
