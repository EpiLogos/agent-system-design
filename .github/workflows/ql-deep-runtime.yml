name: QL Deep Runtime
on:
  push:
    branches: [ql/deep-runtime]
    paths: ['ql-agent-experiments/deep-ql/**','ql-agent-experiments/TYPING-CORPUS-REVIEW-CLARIFICATION-08-14-2026.md','.github/workflows/ql-deep-runtime.yml']
  pull_request:
    paths: ['ql-agent-experiments/deep-ql/**','ql-agent-experiments/TYPING-CORPUS-REVIEW-CLARIFICATION-08-14-2026.md','.github/workflows/ql-deep-runtime.yml']
permissions:
  contents: read
jobs:
  deep-ql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ql-agent-experiments/deep-ql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: npm run conformance
      - name: Run full Experiment Readiness convergence
        if: github.event_name == 'pull_request'
        env:
          DEEP_REVISION: ${{ github.event.pull_request.head.sha }}
        run: npm run readiness
