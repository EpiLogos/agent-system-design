name: QL Deep Runtime
on:
  push:
    branches: [ql/deep-runtime]
    paths: ['ql-agent-experiments/deep-ql/**','.github/workflows/ql-deep-runtime.yml']
  pull_request:
    paths: ['ql-agent-experiments/deep-ql/**','.github/workflows/ql-deep-runtime.yml']
permissions:
  contents: read
jobs:
  deep-ql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ql-agent-experiments/deep-ql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: npm run conformance
      - name: Capture matched host run records
        if: github.event_name == 'pull_request'
        run: |
          node ../experiments/pi/run-smoke.mjs > /tmp/pi.json
          node ../experiments/pydantic/run-smoke.mjs > /tmp/pydantic.json
          node ../experiments/native/run-smoke.mjs > /tmp/native.json
      - name: Compare actual host semantic traces
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { compareTraces } from './comparison/comparator.js';
          const names = ['pi', 'pydantic', 'native'];
          const traces = names.map((name) => JSON.parse(fs.readFileSync(`/tmp/${name}.json`, 'utf8')).ql.events.filter((event) => event.channel === 'runtime-semantic'));
          for (let index = 1; index < traces.length; index += 1) {
            const result = compareTraces(traces[0], traces[index]);
            if (!result.equal) throw new Error(`semantic transition mismatch: pi vs ${names[index]}`);
          }
          console.log(JSON.stringify({ hosts: names, transition_equivalent: true }));
          NODE
